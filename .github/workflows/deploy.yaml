name: Deploy on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > /tmp/sa-key.json
          cat /tmp/sa-key.json | docker login --username json_key --password-stdin cr.yandex
          rm /tmp/sa-key.json

      - name: Build image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app:${{ github.ref_name }} .

      - name: Push image
        run: |
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app:${{ github.ref_name }}

      - name: Setup kubectl
        run: |
          mkdir -p $HOME/.kube
          echo '${{ secrets.KUBE_CONFIG }}' | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/nginx-app nginx=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app:${{ github.ref_name }} --namespace default
          kubectl rollout status deployment/nginx-app --namespace default --timeout=5m
