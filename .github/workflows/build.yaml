name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > /tmp/sa-key.json
          cat /tmp/sa-key.json | docker login --username json_key --password-stdin cr.yandex
          rm /tmp/sa-key.json

      - name: Build image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app:${{ github.sha }} .

      - name: Push image
        run: |
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/app:${{ github.sha }}
